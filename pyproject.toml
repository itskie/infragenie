[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infragenie"
version = "0.1.0"
description = "AI-Native DevSecOps Orchestrator — automates secure containerization and AWS deployment"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kie" }]

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-chroma>=0.1.0",
    "openai>=1.30.0",
    "chromadb>=0.5.0",
    "tiktoken>=0.7.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.22.0",
    "tree-sitter-javascript>=0.22.0",
    "tree-sitter-go>=0.22.0",
    "toml>=0.10.2",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "docker>=7.1.0",
    "subprocess-tee>=0.4.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "boto3-stubs[ecr,ecs,logs,sts]>=1.34.0",
]

[project.urls]
Homepage = "https://github.com/kie/infragenie"
Repository = "https://github.com/kie/infragenie"
Issues = "https://github.com/kie/infragenie/issues"
Documentation = "https://github.com/kie/infragenie#readme"

[project.scripts]
infragenie = "infragenie.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=infragenie --cov-report=term-missing"
